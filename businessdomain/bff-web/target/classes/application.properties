server.port=8080
spring.application.name=bff-web

# URLs of the microservices
reportes.service.url=http://localhost:8081/api/reportes
alertas.service.url=http://localhost:8082/api/alertas

# CORS configuration to allow React frontend
spring.web.cors.allowed-origins=http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
