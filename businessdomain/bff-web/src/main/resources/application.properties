server.port=8080
spring.application.name=bff-web

# URLs de los microservicios
reportes.service.url=http://localhost:8081/api/reportes
alertas.service.url=http://localhost:8082/api/alertas

# Resilience4j - Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.reportes-service.register-health-indicator=true
resilience4j.circuitbreaker.instances.reportes-service.sliding-window-size=5
resilience4j.circuitbreaker.instances.reportes-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.reportes-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.reportes-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.reportes-service.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.circuitbreaker.instances.alertas-service.register-health-indicator=true
resilience4j.circuitbreaker.instances.alertas-service.sliding-window-size=5
resilience4j.circuitbreaker.instances.alertas-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.alertas-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.alertas-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.alertas-service.automatic-transition-from-open-to-half-open-enabled=true

# Spring Boot Actuator (para monitorear Circuit Breaker)
management.endpoints.web.exposure.include=health,circuitbreakers
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
