version: "3.8"

networks:
  valledelsol-net:
    driver: bridge

services:
  # ── Service Discovery ──────────────────────────────────────────────
  eureka-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.eureka
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - valledelsol-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Monitoreo ──────────────────────────────────────────────────────
  spring-boot-admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
    container_name: spring-boot-admin
    ports:
      - "8062:8062"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_started
    networks:
      - valledelsol-net

  # ── API Gateway ────────────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_started
    networks:
      - valledelsol-net

  # ── Keycloak Adapter ───────────────────────────────────────────────
  keycloak-adapter:
    build:
      context: .
      dockerfile: docker/Dockerfile.keycloak
    container_name: keycloak-adapter
    ports:
      - "8088:8088"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_started
    networks:
      - valledelsol-net

  # ── Base de Datos MySQL ────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - valledelsol-net

  # ── Microservicios de Negocio ──────────────────────────────────────
  customer-ms:
    build:
      context: .
      dockerfile: docker/Dockerfile.customer
    container_name: customer-ms
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_started
      mysql:
        condition: service_healthy
    networks:
      - valledelsol-net

  product-ms:
    build:
      context: .
      dockerfile: docker/Dockerfile.product
    container_name: product-ms
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_started
      mysql:
        condition: service_healthy
    networks:
      - valledelsol-net

  reportes-ms:
    build:
      context: .
      dockerfile: docker/Dockerfile.reportes
    container_name: reportes-ms
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_started
      mysql:
        condition: service_healthy
    networks:
      - valledelsol-net

  alertas-ms:
    build:
      context: .
      dockerfile: docker/Dockerfile.alertas
    container_name: alertas-ms
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_started
      mysql:
        condition: service_healthy
    networks:
      - valledelsol-net

  # ── Backend For Frontend (BFF) ─────────────────────────────────────
  bff-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.bff
    container_name: bff-web
    ports:
      - "8084:8084"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - reportes.service.url=http://reportes-ms:8081/api/reportes
      - alertas.service.url=http://alertas-ms:8082/api/alertas
    depends_on:
      eureka-server:
        condition: service_started
    networks:
      - valledelsol-net

  # ── Frontend React ─────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: frontend
    ports:
      - "5173:80"
    depends_on:
      - bff-web
    networks:
      - valledelsol-net

volumes:
  mysql_data:
